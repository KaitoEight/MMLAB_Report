name: mmlab-selfhost
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmlab
      POSTGRES_USER: mmlab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmlab -d mmlab"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: mmlab-selfhost:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    environment: &settings
      DB_HOST: db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      SESSION_KEY_FILE: /run/secrets/session_key
      MMLAB_APP_PASSWORD_FILE: /run/secrets/gmail_password
      GMAIL_MAILBOX: ${GMAIL_MAILBOX:-mmlab@uit.edu.vn}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      ADMIN_USER: ${ADMIN_USER:-admin}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_MODE: ${MAIL_MODE:-preview}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MONTHLY_REPORTS_ENABLED: ${MONTHLY_REPORTS_ENABLED:-true}
      AUTO_REPLY_SINCE: ${AUTO_REPLY_SINCE:-}
    secrets: [postgres_password, admin_password_hash, session_key, gmail_password]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    image: mmlab-selfhost:local
    build: .
    command: ["python", "-u", "worker.py"]
    restart: unless-stopped
    environment: *settings
    secrets: [postgres_password, admin_password_hash, session_key, gmail_password]
    volumes:
      - imap_data:/data/imap
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  imap_data:
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  admin_password_hash:
    file: ./secrets/admin_password_hash.txt
  session_key:
    file: ./secrets/session_key.txt
  gmail_password:
    file: ./secrets/gmail_password.txt
